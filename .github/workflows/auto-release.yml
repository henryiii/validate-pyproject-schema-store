name: Create release on pyproject-schema-store-bot merge
on:
  pull_request:
    types: [closed]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  create-release:
    name: Create release
    if:
      github.event.pull_request.merged == true &&
      github.event.pull_request.user.login == 'pyproject-schema-store-bot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the tag and create the release
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true # the tag push below uses these credentials
      - name: Get version from pyproject.toml
        id: get_version
        uses: mikefarah/yq@c14f446382944492701b16c1ddb48bb9dbe683e3 # v4.53.6
        with:
          cmd: yq .project.version pyproject.toml
      - name: Create git tag
        run: |
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com
          git tag "$VERSION"
          git push origin "$VERSION"
        env:
          VERSION: ${{ steps.get_version.outputs.result }}
      - name: Release
        run: gh release create "$VERSION" --verify-tag --generate-notes
        env:
          # A PAT, so that the release event starts the CD workflow.
          GH_TOKEN: ${{ secrets.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.get_version.outputs.result }}
