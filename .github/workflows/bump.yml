name: Bump
on:
  workflow_dispatch:
  schedule:
    - cron: 0 8 * * * # At 08:00 every day

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  bump:
    name: Bump rendered version if changed
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the branch for the bump PR
      pull-requests: write # open and auto-merge the bump PR
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: generate-token
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Run bump script
        run: |
          uv run tools/sync.py
          git status
          git diff

      - name: Get current version
        shell: python
        id: getver
        run: |
          import tomllib
          import os

          with open("pyproject.toml", "rb") as f:
              pyproject = tomllib.load(f)
          with open(os.environ["GITHUB_OUTPUT"], "w", encoding="utf-8") as f:
              print(f"version={pyproject['project']['version']}", file=f)

      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        id: create-pr
        with:
          title: |
            chore(deps): bump version to ${{ steps.getver.outputs.version }}
          commit-message: |
            chore(deps): bump version to ${{ steps.getver.outputs.version }}
          body: |
            Update the stored schema files and bump to version ${{ steps.getver.outputs.version }}.

            PR generated by the "Update dependencies" [workflow](https://github.com/${{github.repository}}/actions/runs/${{github.run_id}}).

          delete-branch: true
          token: ${{ steps.generate-token.outputs.token }}
          sign-commits: true

      - name: Check all commits are from bot
        id: check-commits
        if: steps.create-pr.outputs.pull-request-number
        run: |
          commits=$(gh api "repos/$REPO/pulls/$PR_NUMBER/commits" --jq '[.[].author.login? // "unknown"]')
          unique_authors=$(echo "$commits" | jq -c 'unique')
          echo "authors=$unique_authors" >> "$GITHUB_OUTPUT"
          if [[ "$unique_authors" == '["pyproject-schema-store-bot[bot]"]' ]]; then
            echo "only-bot=true" >> "$GITHUB_OUTPUT"
          else
            echo "only-bot=false" >> "$GITHUB_OUTPUT"
            echo "Skipping auto-merge: PR has commits from: $unique_authors"
          fi
        env:
          GH_TOKEN: ${{ secrets.token }}
          PR_NUMBER: ${{ steps.create-pr.outputs.pull-request-number }}
          REPO: ${{ github.repository }}

      - name: Enable pull request auto-merge
        if:
          steps.create-pr.outputs.pull-request-number &&
          steps.check-commits.outputs.only-bot == 'true'
        run: |
          gh pr merge --squash --auto --delete-branch "$PR_NUMBER"
        env:
          GH_TOKEN: ${{ secrets.token }}
          PR_NUMBER: ${{ steps.create-pr.outputs.pull-request-number }}
