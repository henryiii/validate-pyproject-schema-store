ci:
  autoupdate_commit_msg: "chore: update pre-commit hooks"
  autofix_commit_msg: "style: pre-commit fixes"
  autoupdate_schedule: "monthly"

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: "3e8a8703264a2f4a69428a0aa4dcb512790b2c8c" # frozen: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-yaml
      - id: debug-statements
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: name-tests-test
        args: ["--pytest-test-first"]
      - id: requirements-txt-fixer
      - id: trailing-whitespace

  - repo: https://github.com/rbubley/mirrors-prettier
    rev: "ef4a397f916211b4a39ccf9d3d9cbb6562157251" # frozen: v3.9.9
    hooks:
      - id: prettier
        types_or: [yaml, markdown, html, css, scss, javascript, json]
        args: [--prose-wrap=always]
        exclude: '^src/validate_pyproject_schema_store/resources/.*\.json'

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: "f12be1ebaa5351c1fc76472de98db2c3446c8253" # frozen: v0.16.10
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format
        types_or: [python, pyi, jupyter, markdown, pyproject]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: "2834ec6639549dd6796205c8f011dedcd587288b" # frozen: v2.4.0
    hooks:
      - id: mypy
        files: src|tests|tools
        args: []
        additional_dependencies:
          - pytest
          - importlib_resources
          - tomlkit
          - aiohttp
          - validate_pyproject

  - repo: https://github.com/codespell-project/codespell
    rev: "57b21406f092110c18776e39b0bda50d37c945c8" # frozen: v2.4.3
    hooks:
      - id: codespell
        args: ["-Lcrate"]
        additional_dependencies:
          - tomli; python_version<'3.11'
        exclude: '^src/validate_pyproject_schema_store/resources/.*\.json'

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: "a6564f5d57444e123433a5c9af733e3975c77229" # frozen: v0.11.0.1-1
    hooks:
      - id: shellcheck

  - repo: local
    hooks:
      - id: disallow-caps
        name: Disallow improper capitalization
        language: pygrep
        entry: PyBind|Numpy|Cmake|CCache|Github|PyTest
        exclude: .pre-commit-config.yaml

  - repo: https://github.com/abravalheri/validate-pyproject
    rev: 17e12779811926f000bdfa1795f9e3735dd71ac3 # frozen: 0.26
    hooks:
      - id: validate-pyproject

  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 4f85d46a92dc17713078e5de73f8a13190edf6fc # frozen: 0.38.2
    hooks:
      - id: check-dependabot
      - id: check-github-workflows
      - id: check-readthedocs

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: "fa412071e4f5d44d44f9e365f4676f9df92456a2" # frozen: v1.30.1
    hooks:
      - id: zizmor
        files: "^\\.github"
        args: [--persona=pedantic]

  - repo: https://github.com/scientific-python/cookie
    rev: 1589a99867d6cac494ac7545fe6a83108580a3ee # frozen: 2026.08.14
    hooks:
      - id: sp-repo-review
